const $=s=>document.querySelector(s), langEl=$("#lang"), placesEl=$("#places"), nearEl=$("#nearestResult"), toast=$("#toast");
let lang=localStorage.getItem("santorini-language")||(T[(navigator.language||"en").slice(0,2)]?(navigator.language||"en").slice(0,2):"en");
const tr=k=>(T[lang]&&T[lang][k])||T.en[k]||k;
const url=p=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.lat+","+p.lng)}&dir_action=navigate`;

function renderPlaces(){
 placesEl.innerHTML=P.map(p=>`<article class="place reveal on"><div class="placeTop"><div class="pin"><svg viewBox="0 0 24 24" fill="none"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.8"/></svg></div><div><h3>${p.name}</h3><p>${tr(p.key)}</p></div></div><a class="go" href="${url(p)}" aria-label="${tr("go")}: ${p.name}">${tr("go")}</a></article>`).join("");
}
function apply(l){
 lang=T[l]?l:"en";document.documentElement.lang=lang;langEl.value=lang;localStorage.setItem("santorini-language",lang);
 document.querySelectorAll("[data-t]").forEach(n=>n.textContent=tr(n.dataset.t));document.title=tr("page");renderPlaces();nearEl.className="nearest";nearEl.textContent="";
}
function dist(a,b,c,d){const r=6371,x=(v)=>v*Math.PI/180,da=x(c-a),do_=x(d-b);const q=Math.sin(da/2)**2+Math.cos(x(a))*Math.cos(x(c))*Math.sin(do_/2)**2;return r*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
$("#nearestBtn").onclick=()=>{nearEl.className="nearest show";nearEl.textContent=tr("locating");if(!navigator.geolocation){nearEl.textContent=tr("locationError");return}navigator.geolocation.getCurrentPosition(({coords})=>{const n=P.map(p=>({...p,d:dist(coords.latitude,coords.longitude,p.lat,p.lng)})).sort((a,b)=>a.d-b.d)[0];nearEl.innerHTML=`${tr("nearest")} <a href="${url(n)}">${n.name} · ${n.d.toFixed(1)} km</a>`},()=>nearEl.textContent=tr("locationError"),{enableHighAccuracy:true,timeout:10000,maximumAge:120000})};
function show(m){toast.textContent=m;toast.classList.add("show");clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove("show"),2300)}
let deferredInstallPrompt=null;
const installBtn=$("#installBtn");
if(!window.matchMedia("(display-mode: standalone)").matches){installBtn.hidden=false}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.hidden=false});
installBtn.onclick=async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    installBtn.hidden=true;
  }else{
    alert(tr("installHelp"));
  }
};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
langEl.onchange=e=>apply(e.target.value);

const pb=$("#partnerBrand"),pl=$("#partnerLogo");pb.textContent=PARTNER_BRAND;if(PARTNER_URL){const a=document.createElement("a");a.className="partnerBrand";a.href=PARTNER_URL;a.textContent=PARTNER_BRAND;pb.replaceWith(a)}if(PARTNER_LOGO){pl.src=PARTNER_LOGO;pl.alt=PARTNER_BRAND;pl.hidden=false}
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");obs.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(e=>obs.observe(e));
apply(lang);
</script>
