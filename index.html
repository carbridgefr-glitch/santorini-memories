<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075e9f">
  <meta name="description" content="A magical digital journey through Santorini.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Santorini — Keep the light">
  <meta property="og:description" content="A magical digital memory from the island of light.">
  <meta property="og:image" content="santorini-hero.webp">
  <link rel="icon" href="santorini-blue-domes.webp">
  <title>Santorini — Keep the light</title>

  <style>
    :root{
      --blue:#075e9f;
      --deep:#063b68;
      --sky:#55bce9;
      --gold:#f4bd67;
      --ink:#17324a;
      --muted:#64798a;
      --white:#fff;
      --shadow:0 22px 70px rgba(6,59,104,.18);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      overflow-x:hidden;
      color:var(--ink);
      font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 5%,rgba(85,188,233,.18),transparent 35rem),
        linear-gradient(#f2fbff,#fff8ee);
    }

    img{display:block;width:100%}
    a{text-decoration:none;color:inherit}
    button,select{font:inherit}
    a,button,select{-webkit-tap-highlight-color:transparent}
    a:focus-visible,button:focus-visible,select:focus-visible{
      outline:3px solid var(--gold);
      outline-offset:4px;
    }

    .top{
      position:fixed;
      z-index:30;
      top:calc(10px + env(safe-area-inset-top));
      left:50%;
      transform:translateX(-50%);
      width:min(94%,760px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 12px 10px 16px;
      border:1px solid rgba(255,255,255,.5);
      border-radius:999px;
      color:#fff;
      background:rgba(4,42,74,.46);
      backdrop-filter:blur(16px);
      box-shadow:0 12px 35px rgba(0,0,0,.18);
    }

    .brand{
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .lang{
      min-height:42px;
      padding:0 36px 0 14px;
      border:1px solid rgba(255,255,255,.45);
      border-radius:999px;
      color:#fff;
      background:rgba(255,255,255,.14);
    }

    .lang option{
      color:var(--ink);
      background:#fff;
    }

    .hero{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:end center;
      overflow:hidden;
      isolation:isolate;
      color:#fff;
      background:var(--deep);
    }

    .hero>img{
      position:absolute;
      z-index:-3;
      inset:-4%;
      width:108%;
      height:108%;
      object-fit:cover;
      animation:breath 18s ease-in-out infinite alternate;
    }

    .hero:before{
      content:"";
      position:absolute;
      z-index:-2;
      inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(3,27,48,.18) 38%,rgba(3,27,48,.88));
    }

    .heroContent{
      width:min(100%,900px);
      padding:150px 24px calc(76px + env(safe-area-inset-bottom));
      text-align:center;
    }

    .eyebrow{
      font-size:.78rem;
      font-weight:850;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .hero h1{
      margin:0 0 16px;
      font:500 clamp(3.5rem,15vw,8rem)/.88 Georgia,serif;
      letter-spacing:-.055em;
      text-shadow:0 8px 28px rgba(0,0,0,.25);
    }

    .heroText{
      max-width:650px;
      margin:0 auto 28px;
      font-size:clamp(1rem,3.8vw,1.25rem);
      color:rgba(255,255,255,.92);
    }

    .btn{
      min-height:56px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px 22px;
      border:0;
      border-radius:999px;
      font-weight:900;
      cursor:pointer;
      transition:.18s;
      box-shadow:0 14px 35px rgba(6,59,104,.2);
    }

    .btn:hover{transform:translateY(-2px)}
    .btnLight{color:var(--deep);background:#fff}
    .btnBlue{color:#fff;background:linear-gradient(135deg,var(--blue),#168ac5)}
    .btnGold{color:#17324a;background:linear-gradient(135deg,#fff4d7,#f4bd67)}
    .btnOutline{
      color:var(--deep);
      border:1px solid rgba(7,94,159,.2);
      background:rgba(255,255,255,.92);
      box-shadow:none;
    }

    .section{
      width:min(100% - 32px,1120px);
      margin:auto;
      padding:clamp(70px,10vw,115px) 0;
    }

    .heading{
      max-width:740px;
      margin:0 auto 40px;
      text-align:center;
    }

    .kicker{
      margin:0 0 10px;
      color:var(--blue);
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .heading h2,.ded h2,.partner h2,.share h2{
      margin:0 0 16px;
      font:500 clamp(2.25rem,8vw,4.5rem)/1 Georgia,serif;
      letter-spacing:-.045em;
    }

    .heading p,.ded p,.partner p{
      color:var(--muted);
      font-size:clamp(1rem,2.8vw,1.12rem);
    }

    .ded,.partner{
      position:relative;
      overflow:hidden;
      padding:clamp(38px,7vw,74px);
      border:1px solid rgba(255,255,255,.8);
      border-radius:32px;
      text-align:center;
      background:rgba(255,255,255,.9);
      box-shadow:var(--shadow);
    }

    .ded p{max-width:720px;margin:0 auto}

    .ded:before,.partner:before{
      content:"";
      position:absolute;
      width:280px;
      height:280px;
      top:-160px;
      right:-130px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(244,189,103,.38),transparent 68%);
      pointer-events:none;
    }

    .grid{
      display:grid;
      gap:24px;
    }

    .card{
      position:relative;
      min-height:500px;
      overflow:hidden;
      border-radius:32px;
      isolation:isolate;
      background:var(--deep);
      box-shadow:var(--shadow);
    }

    .card img{
      position:absolute;
      z-index:-3;
      inset:0;
      height:112%;
      object-fit:cover;
      transform:translateY(-5%) scale(1.03);
    }

    .card:after{
      content:"";
      position:absolute;
      z-index:-2;
      inset:0;
      background:linear-gradient(180deg,transparent 20%,rgba(3,27,48,.2) 55%,rgba(3,27,48,.92));
    }

    .copy{
      min-height:500px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding:clamp(28px,6vw,50px);
      color:#fff;
    }

    .copy h3{
      margin:0 0 8px;
      font:500 clamp(2.1rem,8vw,4rem)/1 Georgia,serif;
      letter-spacing:-.04em;
    }

    .copy p{
      max-width:600px;
      margin:0;
      color:rgba(255,255,255,.87);
    }

    .places{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .place{
      padding:18px;
      border:1px solid rgba(7,94,159,.13);
      border-radius:22px;
      background:rgba(255,255,255,.9);
      box-shadow:0 14px 38px rgba(6,59,104,.09);
    }

    .placeTop{
      display:flex;
      gap:12px;
      margin-bottom:14px;
    }

    .pin{
      width:42px;
      height:42px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      border-radius:14px;
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--sky));
    }

    .pin svg{width:21px}

    .place h3{
      margin:0 0 3px;
      font-size:1rem;
      line-height:1.2;
    }

    .place p{
      margin:0;
      color:var(--muted);
      font-size:.88rem;
      line-height:1.35;
    }

    .go{
      width:100%;
      min-height:50px;
      padding:11px 14px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:var(--blue);
      font-weight:900;
    }

    .actions{
      display:grid;
      gap:13px;
      margin-top:22px;
    }

    .actions .btn{width:100%}

    .nearest{
      display:none;
      margin-top:14px;
      padding:17px;
      border:1px solid rgba(7,94,159,.15);
      border-radius:18px;
      text-align:center;
      background:rgba(255,255,255,.9);
    }

    .nearest.show{display:block}
    .nearest a{color:var(--blue);font-weight:900}

    .share{
      display:grid;
      gap:22px;
      padding:clamp(32px,7vw,64px);
      border-radius:32px;
      color:#fff;
      background:
        radial-gradient(circle at 95% 10%,rgba(255,217,151,.34),transparent 24rem),
        linear-gradient(135deg,#063b68,#0877b8 64%,#36a6d6);
      box-shadow:var(--shadow);
    }

    .share p{
      max-width:670px;
      margin:0;
      color:rgba(255,255,255,.86);
    }

    .share .btn{width:100%}

    .partner{
      background:
        radial-gradient(circle at 10% 10%,rgba(85,188,233,.15),transparent 18rem),
        rgba(255,255,255,.94);
    }

    .partnerLogo{
      width:min(170px,48vw);
      max-height:110px;
      margin:0 auto 22px;
      object-fit:contain;
    }

    .partnerBrand{
      display:inline-block;
      margin:10px auto 14px;
      padding:14px 22px;
      border:1px solid rgba(7,94,159,.16);
      border-radius:999px;
      color:var(--deep);
      background:#ecf9ff;
      font-size:clamp(1.08rem,4vw,1.4rem);
      font-weight:950;
    }

    .partnerDedication{
      max-width:760px;
      margin:0 auto 22px;
      color:var(--ink)!important;
    }

    .partnerServices{
      max-width:800px;
      margin:0 auto 26px;
      padding:14px 16px;
      border:1px solid rgba(7,94,159,.12);
      border-radius:18px;
      color:var(--muted);
      background:rgba(236,249,255,.72);
      font-size:.88rem!important;
      line-height:1.55;
    }

    .partnerButtons{
      display:grid;
      gap:12px;
      margin:0 auto;
      max-width:860px;
    }

    .partnerButtons .btn{width:100%}

    .partnerSocials{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-top:16px;
    }

    .socialChip{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 16px;
      border:1px solid rgba(7,94,159,.16);
      border-radius:999px;
      color:var(--deep);
      background:#fff;
      font-weight:850;
    }

    .partnerClose{
      max-width:720px;
      margin:24px auto 0!important;
      font-size:.92rem!important;
    }

    footer{
      padding:28px 18px calc(34px + env(safe-area-inset-bottom));
      color:#6b7f90;
      text-align:center;
      font-size:.82rem;
    }

    footer a{color:var(--blue);font-weight:850}

    .reveal{
      opacity:0;
      transform:translateY(28px);
      transition:.7s;
    }

    .reveal.on{
      opacity:1;
      transform:none;
    }

    .toast{
      position:fixed;
      z-index:80;
      left:50%;
      bottom:calc(22px + env(safe-area-inset-bottom));
      max-width:calc(100% - 34px);
      padding:12px 18px;
      border-radius:999px;
      color:#fff;
      background:rgba(4,42,74,.95);
      opacity:0;
      transform:translate(-50%,18px);
      transition:.22s;
      pointer-events:none;
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @keyframes breath{
      to{transform:scale(1.08) translate(-1%,-1%)}
    }

    @media(min-width:720px){
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .card:first-child,.card:nth-child(4),.card:last-child{
        grid-column:1/-1;
        min-height:610px;
      }
      .card:first-child .copy,.card:nth-child(4) .copy,.card:last-child .copy{
        min-height:610px;
      }
      .places{grid-template-columns:repeat(3,minmax(0,1fr))}
      .actions{grid-template-columns:1fr 1fr}
      .share{grid-template-columns:1fr auto;align-items:center}
      .share .btn{width:auto;min-width:225px}
      .partnerButtons{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media(min-width:1020px){
      .places{grid-template-columns:repeat(4,minmax(0,1fr))}
      .partnerButtons{grid-template-columns:repeat(3,minmax(0,1fr))}
    }

    @media(max-width:430px){
      .brand{font-size:.78rem}
      .lang{max-width:135px;font-size:.86rem}
      .places{grid-template-columns:1fr}
      .place{
        display:grid;
        grid-template-columns:1fr 52px;
        align-items:center;
        gap:12px;
      }
      .placeTop{margin:0}
      .go{
        width:52px;
        height:52px;
        padding:0;
        font-size:0;
        border-radius:16px;
      }
      .go:after{content:"→";font-size:1.35rem}
    }

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{animation:none!important;transition:none!important}
      .reveal{opacity:1;transform:none}
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="brand">Santorini</div>
    <select id="lang" class="lang" aria-label="Choose language">
      <option value="el">Ελληνικά</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="es">Español</option>
    </select>
  </header>

  <section class="hero">
    <img
      src="santorini-hero.webp"
      alt="Santorini sunset with white houses, blue domes and the Aegean Sea"
      fetchpriority="high"
    >
    <div class="heroContent">
      <p class="eyebrow" data-t="heroKicker"></p>
      <h1 data-t="heroTitle"></h1>
      <p class="heroText" data-t="heroText"></p>
      <a class="btn btnLight" href="#journey">
        <span data-t="explore"></span>
        <span>↓</span>
      </a>
    </div>
  </section>

  <main>
    <section class="section">
      <div class="ded reveal">
        <p class="kicker" data-t="dedKicker"></p>
        <h2 data-t="dedTitle"></h2>
        <p data-t="dedText"></p>
      </div>
    </section>

    <section id="journey" class="section">
      <div class="heading reveal">
        <p class="kicker" data-t="journeyKicker"></p>
        <h2 data-t="journeyTitle"></h2>
        <p data-t="journeyText"></p>
      </div>

      <div class="grid">
        <article class="card reveal">
          <img src="santorini-blue-domes.webp" alt="Blue domes of Santorini" loading="lazy">
          <div class="copy">
            <h3 data-t="domesTitle"></h3>
            <p data-t="domesText"></p>
          </div>
        </article>

        <article class="card reveal">
          <img src="santorini-caldera.webp" alt="Santorini caldera" loading="lazy">
          <div class="copy">
            <h3 data-t="calderaTitle"></h3>
            <p data-t="calderaText"></p>
          </div>
        </article>

        <article class="card reveal">
          <img src="santorini-alley.webp" alt="Santorini alley" loading="lazy">
          <div class="copy">
            <h3 data-t="alleyTitle"></h3>
            <p data-t="alleyText"></p>
          </div>
        </article>

        <article class="card reveal">
          <img src="santorini-lighthouse.png" alt="Akrotiri lighthouse" loading="lazy">
          <div class="copy">
            <h3 data-t="lightTitle"></h3>
            <p data-t="lightText"></p>
          </div>
        </article>

        <article class="card reveal">
          <img src="santorini-harbor.webp" alt="Ammoudi harbor" loading="lazy">
          <div class="copy">
            <h3 data-t="harborTitle"></h3>
            <p data-t="harborText"></p>
          </div>
        </article>

        <article class="card reveal">
          <img src="santorini-volcanic.webp.png" alt="Volcanic coast" loading="lazy">
          <div class="copy">
            <h3 data-t="volcanoTitle"></h3>
            <p data-t="volcanoText"></p>
          </div>
        </article>

        <article class="card reveal">
          <img src="santorini-memory.webp" alt="Santorini memory" loading="lazy">
          <div class="copy">
            <h3 data-t="memoryTitle"></h3>
            <p data-t="memoryText"></p>
          </div>
        </article>
      </div>
    </section>

    <section class="section">
      <div class="heading reveal">
        <p class="kicker" data-t="placesKicker"></p>
        <h2 data-t="placesTitle"></h2>
        <p data-t="placesText"></p>
      </div>

      <div id="places" class="places"></div>

      <div class="actions reveal">
        <a
          class="btn btnBlue"
          href="https://www.google.com/maps/search/?api=1&query=Santorini%20top%20attractions"
        >
          <span data-t="openMap"></span>
        </a>

        <button id="nearestBtn" class="btn btnLight" type="button">
          <span data-t="nearestBtn"></span>
        </button>
      </div>

      <div id="nearestResult" class="nearest" aria-live="polite"></div>
    </section>

    <section class="section">
      <div class="share reveal">
        <div>
          <p class="kicker" style="color:#ccefff" data-t="shareKicker"></p>
          <h2 data-t="shareTitle"></h2>
          <p data-t="shareText"></p>
        </div>

        <button id="shareBtn" class="btn btnLight" type="button">
          <span data-t="shareBtn"></span>
        </button>
      </div>
    </section>

    <section id="partner-section" class="section">
      <div class="partner reveal">
        <img id="partnerLogo" class="partnerLogo" alt="" hidden>

        <p class="kicker" data-t="partnerKicker"></p>
        <h2 data-t="partnerTitle"></h2>

        <div id="partnerBrand" class="partnerBrand"></div>

        <p id="partnerDedication" class="partnerDedication"></p>

        <p class="partnerServices" data-t="partnerServices"></p>

        <div id="partnerButtons" class="partnerButtons"></div>
        <div id="partnerSocials" class="partnerSocials"></div>

        <p class="partnerClose" data-t="partnerClose"></p>
      </div>
    </section>
  </main>

  <footer>
    <div>
      Powered by
      <a href="https://carbridgefr-glitch.github.io/test-profil-page/">Andreas Lazaros</a>
    </div>
    <div>
      Instagram:
      <a href="https://www.instagram.com/lazaros_jewelart/">Lazaros Jewel Art</a>
    </div>
  </footer>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>

      },

      /*

    const shopKey = new URLSearchParams(location.search).get("shop") || "default";
    const partner = PARTNERS[shopKey] || PARTNERS.default;

    let lang =
      localStorage.getItem("santorini-language") ||
      (T[(navigator.language || "en").slice(0,2)]
        ? (navigator.language || "en").slice(0,2)
        : "en");

    const tr = key => (T[lang] && T[lang][key]) || T.en[key] || key;

    function mapDirections(place){
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.lat + "," + place.lng)}&dir_action=navigate`;
    }

    function renderPlaces(){
      placesEl.innerHTML = PLACES.map(place => `
        <article class="place reveal on">
          <div class="placeTop">
            <div class="pin">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </div>
            <div>
              <h3>${place.name}</h3>
              <p>${tr(place.key)}</p>
            </div>
          </div>
          <a class="go" href="${mapDirections(place)}" aria-label="${tr("go")}: ${place.name}">
            ${tr("go")}
          </a>
        </article>
      `).join("");
    }

    function localizedDedication(){
      const value = partner.dedication;
      if(typeof value === "string") return value;
      if(value && typeof value === "object"){
        return value[lang] || value.en || value.el || "";
      }
      return "";
    }

    function cleanPhone(phone){
      return String(phone || "").replace(/[^\d+]/g,"");
    }

    function whatsappUrl(phone){
      return `https://wa.me/${String(phone || "").replace(/\D/g,"")}`;
    }

    function makeVCard(){
      const name = partner.contactName || partner.brand || "Business";
      const phone = cleanPhone(partner.phone);
      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${name}`,
        partner.phone ? `TEL;TYPE=CELL:${phone}` : "",
        partner.email ? `EMAIL:${partner.email}` : "",
        partner.website ? `URL:${partner.website}` : "",
        partner.address ? `ADR;TYPE=WORK:;;${partner.address};;;;` : "",
        `NOTE:Santorini NFC μπρελόκ — ${location.href}`,
        "END:VCARD"
      ].filter(Boolean);

      const blob = new Blob([lines.join("\r\n")], {type:"text/vcard;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${name.replace(/[^\p{L}\p{N}_-]+/gu,"-") || "contact"}.vcf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function createAction(label, href, className="btn btnOutline"){
      const a = document.createElement("a");
      a.className = className;
      a.href = href;
      a.textContent = label;
      return a;
    }

    function renderPartner(){
      const brandEl = $("#partnerBrand");
      const logoEl = $("#partnerLogo");
      const dedicationEl = $("#partnerDedication");
      const buttonsEl = $("#partnerButtons");
      const socialsEl = $("#partnerSocials");

      brandEl.textContent = partner.brand || PARTNERS.default.brand;
      dedicationEl.textContent = localizedDedication();

      if(partner.logo){
        logoEl.src = partner.logo;
        logoEl.alt = partner.brand || "";
        logoEl.hidden = false;
      }else{
        logoEl.hidden = true;
      }

      buttonsEl.innerHTML = "";
      socialsEl.innerHTML = "";

      if(partner.website){
        buttonsEl.appendChild(createAction(tr("website"), partner.website, "btn btnBlue"));
      }

      if(partner.maps){
        buttonsEl.appendChild(createAction(tr("maps"), partner.maps));
      }

      if(partner.review){
        buttonsEl.appendChild(createAction(tr("review"), partner.review, "btn btnGold"));
      }

      if(partner.phone){
        buttonsEl.appendChild(createAction(tr("call"), `tel:${cleanPhone(partner.phone)}`));
      }

      if(partner.whatsapp){
        buttonsEl.appendChild(createAction(tr("whatsapp"), whatsappUrl(partner.whatsapp)));
      }

      if(partner.email){
        buttonsEl.appendChild(createAction(tr("email"), `mailto:${partner.email}`));
      }

      if(
        partner.contactName ||
        partner.phone ||
        partner.email ||
        partner.website ||
        partner.address
      ){
        const saveButton = document.createElement("button");
        saveButton.className = "btn btnOutline";
        saveButton.type = "button";
        saveButton.textContent = tr("saveContact");
        saveButton.addEventListener("click", makeVCard);
        buttonsEl.appendChild(saveButton);
      }

      [
        ["facebook","facebook"],
        ["instagram","instagram"],
        ["tiktok","tiktok"]
      ].forEach(([field,labelKey]) => {
        if(partner[field]){
          socialsEl.appendChild(createAction(tr(labelKey), partner[field], "socialChip"));
        }
      });
    }

    function applyLanguage(nextLang){
      lang = T[nextLang] ? nextLang : "en";
      document.documentElement.lang = lang;
      langEl.value = lang;
      localStorage.setItem("santorini-language",lang);

      document.querySelectorAll("[data-t]").forEach(node => {
        node.textContent = tr(node.dataset.t);
      });

      document.title = tr("page");
      renderPlaces();
      renderPartner();

      nearEl.className = "nearest";
      nearEl.textContent = "";
    }

    function distanceKm(lat1,lon1,lat2,lon2){
      const radius = 6371;
      const toRad = value => value * Math.PI / 180;
      const dLat = toRad(lat2-lat1);
      const dLon = toRad(lon2-lon1);
      const value =
        Math.sin(dLat/2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon/2) ** 2;

      return radius * 2 * Math.atan2(Math.sqrt(value),Math.sqrt(1-value));
    }

    $("#nearestBtn").addEventListener("click", () => {
      nearEl.className = "nearest show";
      nearEl.textContent = tr("locating");

      if(!navigator.geolocation){
        nearEl.textContent = tr("locationError");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        ({coords}) => {
          const nearestPlace = PLACES
            .map(place => ({
              ...place,
              distance:distanceKm(
                coords.latitude,
                coords.longitude,
                place.lat,
                place.lng
              )
            }))
            .sort((a,b) => a.distance-b.distance)[0];

          nearEl.innerHTML = `
            ${tr("nearest")}
            <a href="${mapDirections(nearestPlace)}">
              ${nearestPlace.name} · ${nearestPlace.distance.toFixed(1)} km
            </a>
          `;
        },
        () => {
          nearEl.textContent = tr("locationError");
        },
        {
          enableHighAccuracy:true,
          timeout:10000,
          maximumAge:120000
        }
      );
    });

    function showToast(message){
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"),2300);
    }

    $("#shareBtn").addEventListener("click", async () => {
      const shareData = {
        title:document.title,
        text:tr("shareText"),
        url:location.href
      };

      try{
        if(navigator.share){
          await navigator.share(shareData);
        }else{
          await navigator.clipboard.writeText(location.href);
          showToast(tr("copied"));
        }
      }catch(error){
        if(error.name !== "AbortError"){
          try{
            await navigator.clipboard.writeText(location.href);
            showToast(tr("copied"));
          }catch{
            showToast(location.href);
          }
        }
      }
    });

    langEl.addEventListener("change", event => {
      applyLanguage(event.target.value);
    });

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add("on");
          observer.unobserve(entry.target);
        }
      });
    },{threshold:.12});

    document.querySelectorAll(".reveal").forEach(element => {
      observer.observe(element);
    });

    applyLanguage(lang);
  </script>
</body>
</html>
